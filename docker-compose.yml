version: '3.8'

services:
  ml-mdm-generator:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app/ml-mdm/ml-mdm-matryoshka
      - CUDA_VISIBLE_DEVICES=""
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - ./ml-mdm:/app/ml-mdm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Load balancer simulation with multiple instances
  ml-mdm-generator-2:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8081:8080"
    environment:
      - PYTHONPATH=/app/ml-mdm/ml-mdm-matryoshka
      - CUDA_VISIBLE_DEVICES=""
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - ./ml-mdm:/app/ml-mdm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ml-mdm-generator-3:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      - "8082:8080"
    environment:
      - PYTHONPATH=/app/ml-mdm/ml-mdm-matryoshka
      - CUDA_VISIBLE_DEVICES=""
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    volumes:
      - ./ml-mdm:/app/ml-mdm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Simple load balancer using nginx
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - ml-mdm-generator
      - ml-mdm-generator-2
      - ml-mdm-generator-3
    restart: unless-stopped
