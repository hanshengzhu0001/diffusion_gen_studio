apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: diffusion-api-ingress
  namespace: diffusion-gen-studio
  annotations:
    # AWS Load Balancer Controller annotations
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "10"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
    
    # SSL and security
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-west-2:ACCOUNT:certificate/CERT-ID"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
    
    # Performance optimizations
    alb.ingress.kubernetes.io/load-balancer-attributes: |
      idle_timeout.timeout_seconds=300,
      routing.http2.enabled=true,
      access_logs.s3.enabled=true,
      access_logs.s3.bucket=diffusion-alb-logs,
      access_logs.s3.prefix=production
    
    # Rate limiting (if using AWS WAF)
    alb.ingress.kubernetes.io/wafv2-acl-arn: "arn:aws:wafv2:us-west-2:ACCOUNT:webacl/diffusion-api-waf"
spec:
  rules:
  - host: api.diffusion-gen-studio.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: diffusion-api-service
            port:
              number: 80
  tls:
  - hosts:
    - api.diffusion-gen-studio.com
