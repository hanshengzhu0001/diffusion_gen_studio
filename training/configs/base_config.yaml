# Base Training Configuration for DiffusionArt Gen Studio

model:
  name: "stable_diffusion_xl"
  architecture: "unet"
  resolution: 1024
  channels: 4
  attention_heads: 16
  attention_head_dim: 64
  cross_attention_dim: 2048
  
training:
  batch_size: 4  # Per GPU
  gradient_accumulation_steps: 4
  learning_rate: 1e-4
  lr_scheduler: "cosine_with_restarts"
  num_epochs: 100
  warmup_steps: 1000
  max_grad_norm: 1.0
  
  # Multi-GPU settings
  distributed: true
  num_gpus: 4
  mixed_precision: "fp16"
  gradient_checkpointing: true

data:
  dataset_name: "custom_text_image_pairs"
  train_data_dir: "data/train"
  val_data_dir: "data/val"
  resolution: 1024
  center_crop: true
  random_flip: true
  num_workers: 8
  pin_memory: true

optimizer:
  type: "adamw"
  beta1: 0.9
  beta2: 0.999
  weight_decay: 0.01
  eps: 1e-8

logging:
  wandb_project: "diffusion-gen-studio"
  log_interval: 100
  save_interval: 1000
  eval_interval: 2000
  
checkpointing:
  save_dir: "checkpoints"
  keep_last_n: 3
  save_best: true
  monitor_metric: "val_loss"

coreflow:
  pipeline_name: "text_to_image_training"
  enable_profiling: true
  cache_intermediate: true
  parallel_stages: 2
